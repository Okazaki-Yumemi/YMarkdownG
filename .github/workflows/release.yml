name: Publish Desktop Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, runner: windows-latest, command: 'npm run package:win' }
          - { platform: macos-arm64, runner: macos-15, command: 'npm run package:mac -- --arm64' }
          - { platform: macos-x64, runner: macos-15-intel, command: 'npm run package:mac -- --x64' }
          - { platform: linux-x64, runner: ubuntu-22.04, command: 'npm run package:linux' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - name: Install dependencies and runtime
        run: |
          set -euo pipefail
          npm ci
          node -e "require('electron')"
      - name: Check version and native storage
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version) throw Error('Tag and version differ')"
          node --test tests/native-store.test.cjs
      - name: Build ${{ matrix.platform }}
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/*.yml
            !release/builder-*.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { pattern: 'desktop-*', path: release, merge-multiple: true }
      - name: Verify platform assets, checksum and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          required=("YMarkdownG-$version-Windows-x64.exe" "YMarkdownG-$version-Setup-x64.exe" "YMarkdownG-$version-Setup-x64.exe.blockmap" "latest.yml" "YMarkdownG-$version-macOS-arm64.dmg" "YMarkdownG-$version-macOS-x64.dmg" "YMarkdownG-$version-macOS-arm64.zip" "YMarkdownG-$version-macOS-x64.zip" "YMarkdownG-$version-Linux-x64.AppImage")
          for name in "${required[@]}"; do test -s "release/$name" || { echo "Missing $name"; exit 1; }; done
          (cd release && sha256sum -- * > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt release/
          notes=".github/release-notes/$RELEASE_TAG.md"
          test -f "$notes"
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            jq -e '.isDraft == true' existing-release.json >/dev/null || { echo 'Release already published; refusing overwrite'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "YMarkdownG $RELEASE_TAG · Desktop" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release view "$RELEASE_TAG" --json assets > uploaded-assets.json
          for file in release/*; do
            name="$(basename "$file")"; bytes="$(stat -c%s "$file")"
            jq -e --arg name "$name" --argjson bytes "$bytes" '.assets | any(.name == $name and .size == $bytes)' uploaded-assets.json >/dev/null
          done
          gh release edit "$RELEASE_TAG" --draft=false --latest

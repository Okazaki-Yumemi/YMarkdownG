name: Publish Desktop Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, runner: windows-latest, command: 'npm run package:win' }
          - { platform: macos-arm64, runner: macos-15, command: 'npm run package:mac -- --arm64' }
          - { platform: macos-x64, runner: macos-15-intel, command: 'npm run package:mac -- --x64' }
          - { platform: linux-x64, runner: ubuntu-22.04, command: 'npm run package:linux' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - name: Install dependencies and runtime
        run: |
          set -euo pipefail
          npm ci
          node -e "require('electron')"
      - name: Check version and native storage
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version) throw Error('Tag and version differ')"
          node --test tests/native-store.test.cjs
      - name: Build ${{ matrix.platform }}
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/*.yml
            !release/builder-*.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { pattern: 'desktop-*', path: release, merge-multiple: true }
      - name: Verify platform assets, checksum and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish-release.sh
